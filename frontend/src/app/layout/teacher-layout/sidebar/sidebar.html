<aside
  class="fixed lg:sticky top-0 left-0 h-screen w-72 bg-white border-r border-slate-100 z-30 transform lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-sm"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
>
  <!-- LOGO -->
  <div class="p-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200"
      >
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6" />
        </svg>
      </div>
      <span
        class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-700 to-indigo-500"
      >
        EduProf
      </span>
    </div>

    <!-- Close Button (Mobile only) -->
    <button
      (click)="toggleSidebar()"
      class="lg:hidden p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors"
      aria-label="Fermer le menu"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- NAVIGATION MENU -->
  <nav class="px-4 py-4 flex-1 space-y-6 overflow-y-auto">
    <!-- GENERAL -->
    <div>
      <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
        Principal
      </p>
      <div class="space-y-1">
        <a
          routerLink="/teacher/dashboard"
          routerLinkActive="bg-indigo-50 text-indigo-700 font-medium"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-50 hover:text-slate-900"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span>Tableau de bord</span>
        </a>
        <a
          routerLink="/teacher/profile"
          routerLinkActive="bg-indigo-50 text-indigo-700 font-medium"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-50 hover:text-slate-900"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 118 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Mon profil</span>
        </a>
        <a
          routerLink="/teacher/schedules"
          routerLinkActive="bg-indigo-50 text-indigo-700 font-medium"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-50 hover:text-slate-900"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span>Mon emploi du temps</span>
        </a>
      </div>
    </div>



    <!-- ACCOUNT -->
    <div>
      <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">
        Compte
      </p>
      <div class="space-y-1">
        <!-- Logout -->
        <button
          (click)="authService.logout()"
          class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-rose-500 hover:bg-rose-50 hover:text-rose-700 cursor-pointer"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Déconnexion</span>
        </button>
      </div>
    </div>
  </nav>
</aside>

<!-- Mobile Backdrop Overlay -->
@if (isOpen()) {
  <div
    (click)="toggleSidebar()"
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-20 lg:hidden transition-opacity duration-300"
  ></div>
}

<!-- Floating Mobile Menu Button -->
@if (!isOpen()) {
  <button
    (click)="toggleSidebar()"
    class="fixed top-3 left-4 z-40 lg:hidden flex items-center justify-center w-10 h-10 bg-white border border-slate-200 rounded-xl shadow-sm text-slate-600 hover:bg-slate-50 transition-all"
    aria-label="Ouvrir le menu"
  >
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
}
